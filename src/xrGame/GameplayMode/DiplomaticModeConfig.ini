[GameplayMode]
; Default gameplay mode on startup.
; 0 = Diplomatic (recommended)
; 1 = Original (violent gameplay)
default_mode=0
show_violent_content_warning=true

[DiplomaticMode]
enable_hologram_projectors=true
enable_npc_inference=true
pacification_meter_speed=1.0
hologram_opacity=0.65
hologram_glow_intensity=1.0
hologram_shimmer_intensity=0.3
npc_hologram_opacity=0.45
npc_hologram_delay_ms=75
npc_hologram_flicker_chance=0.15
enable_diplomatic_tutorials=true

[Content]
load_kinetic_weapons=false
load_combat_audio=false
load_blood_effects=false
load_death_animations=false
load_hologram_projectors=true
load_pacification_audio=true
load_surrender_animations=true
