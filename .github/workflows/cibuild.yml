name: Build

on:
  push:
    branches-ignore:
      - "dependabot/*"
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    name: Windows ${{ matrix.arch }}-${{ matrix.configuration }} (clang-cl)
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        configuration: [debug, mixed, release, rmg]
        arch: [win64, win32]
    steps:
    - uses: actions/checkout@main
      with:
        submodules: recursive

    - name: Set up MSVC environment
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: ${{ matrix.arch == 'win32' && 'amd64_x86' || 'amd64' }}

    - name: Configure and build
      run: cmake --workflow --preset ${{ matrix.arch }}-${{ matrix.configuration }}

    - name: Package
      id: package
      run: cpack --preset ${{ matrix.arch }}-${{ matrix.configuration }}

    - name: Upload OpenXRay artifact
      if: steps.package.outcome == 'success'
      uses: actions/upload-artifact@main
      with:
        name: Windows ${{ matrix.arch }}-${{ matrix.configuration }} (clang-cl github-${{ github.run_number }})
        path: cmake_builds/*/artifacts/openxray*.*

    - name: Update latest-nightly tag
      uses: EndBug/latest-tag@latest
      if: github.ref_name == 'dev'
      id: update-latest-nightly-tag
      with:
        ref: latest-nightly

    - name: Publish latest nightly build
      if: ${{ steps.update-latest-nightly-tag.outcome == 'success' }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: gh release upload --clobber latest-nightly cmake_builds/*/artifacts/openxray*.*

  cmake:
    name: ${{ matrix.platform.name }} ${{ matrix.configuration }} ${{ matrix.platform.arch }} (${{ matrix.platform.cc || 'unknown compiler' }})
    runs-on: ${{ matrix.platform.os }}

    container: ${{ matrix.platform.container || '' }}

    defaults:
      run:
        shell: ${{ matrix.platform.shell || 'bash -e {0}' }}

    env:
      CFLAGS: "-w"
      CXXFLAGS: "-w"
      HOMEBREW_NO_AUTO_UPDATE: 1

    strategy:
      fail-fast: false
      matrix:
        platform:
        # cc is always set for the correct naming of the job.
        # Both cc and cxx should be set if we want to change the compiler.
        # You may also want to set XRAY_LINKER when changing the compiler.
        - { name: Ubuntu,    os: ubuntu-latest,    arch: amd64,   cc: gcc, }
        - { name: Ubuntu,    os: ubuntu-latest,    arch: amd64,   cc: clang, cxx: clang++, flags: "-DXRAY_LINKER=lld", }
        - { name: Ubuntu,    os: ubuntu-24.04-arm, arch: arm64,   cc: gcc }
        #- { name: Ubuntu,    os: ubuntu-latest,    arch: ppc64el, cc: gcc,   container: 'dockcross/linux-ppc64le:latest', }
        - { name: Alpine,    os: ubuntu-latest,    arch: x86_64,  cc: gcc,   shell: 'alpine.sh {0}', flags: "-DXRAY_LINKER=mold", }
        - { name: Alpine,    os: ubuntu-latest,    arch: x86,     cc: gcc,   shell: 'alpine.sh {0}', flags: "-DXRAY_LINKER=mold", }
        - { name: Fedora,    os: ubuntu-latest,    arch: x86_64,  cc: gcc,   container: 'fedora:latest', }
        #- { name: Haiku,     os: ubuntu-latest,    arch: x86_64,  cc: x86_64-unknown-haiku-gcc, cxx: x86_64-unknown-haiku-g++, container: 'haiku/cross-compiler:x86_64-r1beta4', }
        - { name: AppImage,  os: ubuntu-latest,    arch: amd64,   cc: gcc,   flags: "-DBUILD_SHARED_LIBS=OFF", linuxdeploy: linuxdeploy-x86_64.AppImage }
        - { name: AppImage,  os: ubuntu-24.04-arm, arch: arm64,   cc: gcc,   flags: "-DBUILD_SHARED_LIBS=OFF", linuxdeploy: linuxdeploy-aarch64.AppImage }
        # macOS images have tighter concurrency limits; keep the matrix minimal.
        # Pin the deployment target so newer runner images don't pass an unsupported
        # system version (e.g. 25.4.0) down to AppleClang/LuaJIT architecture detection.
        - { name: macOS,          os: macos-latest,    arch: arm64,  cc: clang, threads: 3, generator: Ninja, flags: "-DCMAKE_OSX_DEPLOYMENT_TARGET=14.0 -DCPACK_GENERATOR=ZIP -DNVRHI_WITH_METAL3=OFF" }
        - { name: macOS Intel,    os: macos-15-intel,  arch: x86_64, cc: clang, generator: Ninja, flags: "-DCMAKE_OSX_ARCHITECTURES=x86_64 -DCMAKE_OSX_DEPLOYMENT_TARGET=14.0 -DCPACK_GENERATOR=ZIP -DNVRHI_WITH_METAL3=OFF" }

        configuration: [Debug, Mixed, Release, ReleaseMasterGold]

    steps:
    - name: Install latest stable Alpine Linux and packages
      if: ${{ matrix.platform.name == 'Alpine' }}
      uses: jirutka/setup-alpine@master
      with:
        arch: ${{ matrix.platform.arch }}
        branch: 'latest-stable'
        packages: >-
          build-base cmake git mold python3 linux-headers sdl2-dev lzo-dev libjpeg-turbo-dev openal-soft-dev libogg-dev libtheora-dev libvorbis-dev
          openssl-dev
          libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxfixes-dev libxi-dev libxscrnsaver-dev libxtst-dev libxkbcommon-dev
          wayland-dev wayland-protocols libdecor-dev mesa-dev libdrm-dev eudev-dev dbus-dev alsa-lib-dev pulseaudio-dev pipewire-dev

    - name: Install Ubuntu packages
      if: ${{ matrix.platform.name == 'Ubuntu' || matrix.platform.name == 'AppImage' }}
      run: |
          sudo dpkg --add-architecture ${{ matrix.platform.arch }}
          sudo apt-get update -qq
          pkgs=(
              libsdl2-dev liblzo2-dev libjpeg-dev libopenal-dev libogg-dev libtheora-dev libvorbis-dev
              libssl-dev
              libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxfixes-dev libxi-dev libxss-dev libxtst-dev libxkbcommon-dev
              libwayland-dev libdecor-0-dev libdrm-dev libgbm-dev libgl-dev libgles-dev libegl-dev
              libdbus-1-dev libudev-dev libasound2-dev libpulse-dev libpipewire-0.3-dev
          )
          sudo apt-get install -qq -y "${pkgs[@]/%/:${{ matrix.platform.arch }}}" wayland-protocols

    - name: Install Clang Ubuntu packages
      if: ${{ matrix.platform.name == 'Ubuntu' && matrix.platform.cxx == 'clang++' }}
      run: sudo apt-get install -qq -y libc++-dev

    - name: Install macOS packages
      if: ${{ startsWith(matrix.platform.name, 'macOS') }}
      run: |
          brew install ccache cmake dylibbundler ninja sdl2 lzo libogg libvorbis theora openal-soft jpeg-turbo

    - name: Install Fedora packages
      if: ${{ matrix.platform.name == 'Fedora' }}
      run: >-
        dnf install -y git gcc gcc-c++ rpmdevtools cmake python3 SDL2-devel lzo-devel libjpeg-turbo-devel openal-soft-devel libogg-devel libtheora-devel libvorbis-devel
        openssl-devel zlib-ng-compat-static
        libX11-devel libXext-devel libXrandr-devel libXcursor-devel libXfixes-devel libXi-devel libXScrnSaver-devel libXtst-devel libxkbcommon-devel
        wayland-devel wayland-protocols-devel libdecor-devel libdrm-devel mesa-libgbm-devel mesa-libGL-devel mesa-libGLES-devel mesa-libEGL-devel
        dbus-devel systemd-devel alsa-lib-devel pulseaudio-libs-devel pipewire-devel

    - name: Install AppImage linuxdeploy
      if: ${{ matrix.platform.name == 'AppImage' }}
      uses: pcolby/install-linuxdeploy@v1
      with:
        plugins: appimage

    - name: Set environment variables
      if: ${{ matrix.platform.cc != '' && matrix.platform.cxx != '' }}
      run: |
        echo "CC=${{ matrix.platform.cc }}" >> $GITHUB_ENV
        echo "CXX=${{ matrix.platform.cxx }}" >> $GITHUB_ENV

    - uses: actions/checkout@main
      with:
        submodules: recursive

    - name: Configure ccache
      if: ${{ startsWith(matrix.platform.name, 'macOS') }}
      run: |
        echo "CCACHE_DIR=$HOME/.ccache" >> $GITHUB_ENV
        mkdir -p "$HOME/.ccache"

    - name: Restore ccache
      if: ${{ startsWith(matrix.platform.name, 'macOS') }}
      uses: actions/cache@main
      with:
        path: ~/.ccache
        key: ccache-${{ runner.os }}-${{ matrix.platform.arch }}-${{ matrix.configuration }}-${{ hashFiles('CMakeLists.txt', 'cmake/**', 'src/**/CMakeLists.txt', 'Externals/**/CMakeLists.txt') }}
        restore-keys: |
          ccache-${{ runner.os }}-${{ matrix.platform.arch }}-${{ matrix.configuration }}-
          ccache-${{ runner.os }}-${{ matrix.platform.arch }}-

    - name: Run CMake
      run: cmake ${{ matrix.platform.generator && format('-G {0}', matrix.platform.generator) || '' }} -B build -DCMAKE_BUILD_TYPE=${{ matrix.configuration }} -DCMAKE_UNITY_BUILD=ON ${{ matrix.platform.flags }} --log-level VERBOSE

    - name: Run CMake Build
      id: cmake-build
      run: cmake --build build --config ${{ matrix.configuration }} --parallel ${{ matrix.platform.threads || 4 }}

    - name: Show ccache stats
      if: ${{ startsWith(matrix.platform.name, 'macOS') }}
      run: ccache -s || true

    - name: Make macOS app bundle
      if: ${{ startsWith(matrix.platform.name, 'macOS') && matrix.configuration == 'Release' && steps.cmake-build.outcome == 'success' }}
      id: make-macos-app-bundle
      run: |
          bash misc/macos/make_app_bundle.sh "${{ matrix.platform.arch }}" "${{ matrix.configuration }}"
          file build/artifacts/openxray*.*

    # TODO: Merge this step with 'Make AppImage' once we switch to CMake 4.2 which directly supports AppImage generation with CPack
    # https://cmake.org/cmake/help/latest/cpack_gen/appimage.html
    - name: Make package
      if: ${{ steps.cmake-build.outcome == 'success' && matrix.platform.name != 'AppImage' && !startsWith(matrix.platform.name, 'macOS') }}
      id: make-package
      #continue-on-error: true
      working-directory: build
      run: |
          cpack -B artifacts -C ${{ matrix.configuration }} -DCPACK_THREADS=${{ matrix.platform.threads || 4 }}
          file artifacts/openxray*.*

    - name: Make AppImage
      if: ${{ steps.cmake-build.outcome == 'success' && matrix.platform.name == 'AppImage' }}
      id: make-appimage
      run: |
          DESTDIR=AppDir cmake --install build --prefix /usr
          ${{ matrix.platform.linuxdeploy }} --appdir AppDir --output appimage --executable AppDir/usr/bin/xr_3da --desktop-file AppDir/usr/share/applications/openxray_cop.desktop --desktop-file AppDir/usr/share/applications/openxray_cs.desktop --desktop-file AppDir/usr/share/applications/openxray_soc.desktop --icon-file AppDir/usr/share/icons/hicolor/64x64/apps/openxray_cop.png --icon-file AppDir/usr/share/icons/hicolor/64x64/apps/openxray_cs.png --icon-file AppDir/usr/share/icons/hicolor/64x64/apps/openxray_soc.png
          mkdir -p build/artifacts
          mv *.AppImage build/artifacts/openxray-${{ matrix.configuration }}-${{ matrix.platform.arch }}.AppImage
          file build/artifacts/openxray*.*

    - name: Upload OpenXRay artifact
      if: ${{ steps.make-package.outcome == 'success' || steps.make-appimage.outcome == 'success' || steps.make-macos-app-bundle.outcome == 'success' }}
      uses: actions/upload-artifact@main
      with:
        name: ${{ matrix.platform.name }} ${{ matrix.configuration }} ${{ matrix.platform.arch }} (${{ matrix.platform.cc }} github-${{ github.run_number }})
        path: build/artifacts/openxray*.*

  bsd:
    name: ${{ matrix.platform.name }} ${{ matrix.configuration }} ${{ matrix.platform.arch }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CFLAGS: "-w"
      CXXFLAGS: "-w"
    strategy:
      fail-fast: false
      matrix:
        platform:
        # FreeBSD package repositories may be ahead of the VM image; tell pkg to
        # ignore the OS version mismatch so packages still install.
        - { name: FreeBSD, os: freebsd, os-version: '14.3', arch: x86_64,
            install-cmd: "sudo env IGNORE_OSVERSION=yes pkg update && sudo env IGNORE_OSVERSION=yes pkg install -y cmake git python3 sdl2 lzo2 jpeg-turbo openal-soft libogg libtheora libvorbis libX11 libXext libXrandr libXcursor libXfixes libXi libXScrnSaver libXtst libxkbcommon wayland wayland-protocols evdev-proto libdrm mesa-libs pkgconf"
          }
        - { name: OpenBSD, os: openbsd, os-version: '7.6',  arch: x86_64,
            install-cmd: "sudo pkg_add cmake git python%3 SDL2 lzo2 jpeg openal libogg libtheora libvorbis",
          }
        - { name: NetBSD,  os: netbsd,  os-version: '10.1',  arch: x86_64,
            install-cmd: "sudo pkgin -y install cmake git-base python313 SDL2 lzo libjpeg-turbo openal-soft libogg libtheora libvorbis",
          }
        #- { name: Haiku,  os: haiku,  os-version: 'r1beta5',  arch: x86_64,
        #    install-cmd: "sudo pkgman install -y cmake libsdl2_devel lzo_devel libjpeg_turbo_devel openal_devel libogg_devel libtheora_devel libvorbis_devel",
        #  }
        configuration: [Debug, Release]

    steps:
    - uses: actions/checkout@main
      with:
        submodules: recursive

    - name: Setup ${{ matrix.platform.name }} and packages
      uses: cross-platform-actions/action@v0.32.0
      with:
        operating_system: ${{ matrix.platform.os }}
        architecture: ${{ matrix.platform.arch }}
        version: ${{ matrix.platform.os-version }}
        cpu_count: 4
        memory: 13G
        environment_variables: CFLAGS CXXFLAGS
        shutdown_vm: false
        sync_files: runner-to-vm
        run: ${{ matrix.platform.install-cmd }}

    - name: Run CMake
      uses: cross-platform-actions/action@v0.32.0
      with:
        operating_system: ${{ matrix.platform.os }}
        architecture: ${{ matrix.platform.arch }}
        version: ${{ matrix.platform.os-version }}
        cpu_count: 4
        memory: 13G
        environment_variables: CFLAGS CXXFLAGS
        shutdown_vm: false
        sync_files: false
        run: cmake -B build -DCMAKE_BUILD_TYPE=${{ matrix.Configuration }} -DCMAKE_UNITY_BUILD=ON --log-level VERBOSE

    - name: Run CMake Build
      uses: cross-platform-actions/action@v0.32.0
      with:
        operating_system: ${{ matrix.platform.os }}
        architecture: ${{ matrix.platform.arch }}
        version: ${{ matrix.platform.os-version }}
        cpu_count: 4
        memory: 13G
        environment_variables: CFLAGS CXXFLAGS
        shutdown_vm: false
        sync_files: false
        run: cmake --build build --config ${{ matrix.Configuration }} --parallel 4

  flatpak:
    name: Flatpak ${{ matrix.platform.arch }}
    runs-on: ${{ matrix.platform.os }}

    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-25.08
      options: --privileged

    strategy:
      fail-fast: false
      matrix:
        platform:
          - arch: x86_64
            os: ubuntu-latest
          - arch: aarch64
            os: ubuntu-24.04-arm

    steps:
      - uses: actions/checkout@main

      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: io.github.OpenXRay.xray-16-${{ matrix.platform.arch }}-${{ github.run_number }}.flatpak
          manifest-path: misc/flatpak/manifest.yml
          arch: ${{ matrix.platform.arch }}
          verbose: true
