name: Collision regression tests

on:
  push:
    branches-ignore: ["dependabot/*"]
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    name: Windows x64 ${{ matrix.configuration }} (both backends)
    runs-on: windows-2022
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        configuration: [Debug, Release]
    steps:
      - uses: actions/checkout@main
        with:
          submodules: recursive
      - uses: nuget/setup-nuget@main
      - name: Build native dependencies, both backends and run collision tests
        shell: pwsh
        run: ./misc/windows/test-collision.ps1 -Configuration ${{ matrix.configuration }}
      - name: Upload build and test logs
        if: always()
        uses: actions/upload-artifact@main
        with:
          name: collision-windows-x64-${{ matrix.configuration }}-logs
          path: build/windows-collision/logs/

  collision:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        backend: ["ON", "OFF"]
    steps:
      - uses: actions/checkout@main
        with:
          submodules: recursive
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ninja-build libsdl2-dev liblzo2-dev libjpeg-dev libopenal-dev libogg-dev libtheora-dev libvorbis-dev
      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        run: brew install cmake ninja sdl2 lzo jpeg-turbo openal-soft libogg theora libvorbis
      - name: Configure Linux
        if: runner.os == 'Linux'
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DXRAY_USE_JOLT_CDB=${{ matrix.backend }} -DXRAY_BUILD_CDB_TESTS=ON
      - name: Configure macOS
        if: runner.os == 'macOS'
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DCMAKE_OSX_DEPLOYMENT_TARGET=14.0 -DCMAKE_PREFIX_PATH="$(brew --prefix);$(brew --prefix openal-soft)" -DXRAY_USE_JOLT_CDB=${{ matrix.backend }} -DXRAY_BUILD_CDB_TESTS=ON
      - name: Build engine and tests
        run: cmake --build build --parallel 3
      - name: Test
        run: ctest --test-dir build --output-on-failure -R '^xrCDB\.'
